    - Branch
    - Branch Code
    dept_code:
    - dept_code
    - Dept Code
    - Department
    job_title:
    - job_title
    - Title
    - Job Title
    regular_pay:
    - regular_pay
    - Regular Pay
    overtime_pay:
    - overtime_pay
    - Overtime Pay
    gross_pay:
    - gross_pay
    - Gross Pay
    - Gross Wages
    employer_fica:
    - employer_fica
    - ER FICA
    employer_futa_suta:
    - employer_futa_suta
    - ER FUTA/SUTA
    employer_taxes:
    - employer_taxes
    - Employer Taxes
    employer_401k_match:
    - employer_401k_match
    - ER 401k
    employer_medical:
    - employer_medical
    - ER Medical
    employer_benefits:
    - employer_benefits
